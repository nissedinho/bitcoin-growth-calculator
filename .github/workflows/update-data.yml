name: Refresh market data

# The price dataset previously went 19 months stale, which silently broke every
# recent date on the site. This keeps it current without anyone remembering to.
on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays, 06:17 UTC
  workflow_dispatch:        # and on demand

permissions:
  contents: write

concurrency:
  group: refresh-market-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh Bitcoin prices
        id: btc
        run: python3 scripts/update_btc_prices.py
        continue-on-error: true

      - name: Refresh CPI / S&P 500 / gold
        id: series
        run: python3 scripts/fetch_series.py
        continue-on-error: true

      - name: Fail if every source was unreachable
        if: steps.btc.outcome == 'failure' && steps.series.outcome == 'failure'
        run: |
          echo "Both refresh steps failed — not committing anything." >&2
          exit 1

      - name: Sanity-check the result
        run: python3 scripts/verify_data.py

      - name: Commit refreshed data
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes; data already current."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh market data ($(date -u +%Y-%m-%d))"
          git push
