name: Refresh market data

# The price dataset previously went 19 months stale, which silently broke every
# recent date on the site. This keeps it current without anyone remembering to.
on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays, 06:17 UTC
  workflow_dispatch:        # and on demand

permissions:
  contents: write

concurrency:
  group: refresh-market-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Exit codes are captured rather than using continue-on-error, which
      # rewrites a failed step's conclusion to success and hid a half-failed
      # refresh on the first run. 0 = all sources, 2 = partial, anything else
      # = nothing obtained.
      - name: Refresh Bitcoin prices
        id: btc
        run: |
          set +e
          python3 scripts/update_btc_prices.py
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Refresh CPI / S&P 500 / gold
        id: series
        run: |
          set +e
          python3 scripts/fetch_series.py
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Fail if nothing could be fetched
        if: steps.btc.outputs.code != '0' && steps.series.outputs.code == '1'
        run: |
          echo "Every source was unreachable - not committing anything." >&2
          exit 1

      - name: Report partial refresh
        if: steps.btc.outputs.code != '0' || steps.series.outputs.code != '0'
        run: |
          {
            echo "### Market data refresh was partial"
            echo ""
            echo "| Step | Exit code |"
            echo "| --- | --- |"
            echo "| Bitcoin prices | ${{ steps.btc.outputs.code }} |"
            echo "| CPI / S&P 500 / gold | ${{ steps.series.outputs.code }} |"
            echo ""
            echo "Series that failed kept their previous values; see the step logs."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Partial data refresh::btc=${{ steps.btc.outputs.code }} series=${{ steps.series.outputs.code }} - some sources were unreachable, previous values kept"

      - name: Sanity-check the result
        run: python3 scripts/verify_data.py

      - name: Commit refreshed data
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes; data already current."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh market data ($(date -u +%Y-%m-%d))"
          git push
